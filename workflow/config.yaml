# Snakemake workflow configuration

# RNA-seq analysis
rnaseq:
  # DESeq2 parameters
  deseq2:
    padj_threshold: 0.05
    log2fc_threshold: 1.0
    size_factor_threshold: 0.3  # Exclude samples below this
    
  # RNA-seq samples in metadata order
  samples:
    - "C2M_colon"
    - "C2M_spleen"
    - "C3M_spleen"
    - "C3U_colon"
    - "C5U_colon"
    - "D2M_colon"
    - "D2U_colon"
    - "D2U_spleen"
    - "D3M_colon"
    - "D3M_spleen"
    - "D3U_colon"
    - "D3U_spleen"
    - "D5U_colon"
    - "E2M_spleen"
    - "E2U_spleen"
    - "E5M_colon"
    - "E5M_spleen"
    - "E5U_colon"
    - "E5U_spleen"
    - "F2M_colon"
    - "F3M_colon"
    - "F3M_spleen"
    - "F3U_colon"
    - "F5M_spleen"
    - "F5U_colon"

  # Explicit RNA-seq contrasts
  contrasts:
    - id: "colon_DSS_vs_CTL"
      tissue: "colon"
      comparison: "DSS_vs_CTL"
      case: "DSS"
      control: "CTL"
    - id: "colon_DSS.CR_vs_CTL"
      tissue: "colon"
      comparison: "DSS.CR_vs_CTL"
      case: "DSS.CR"
      control: "CTL"
    - id: "colon_DSS.CR_vs_DSS"
      tissue: "colon"
      comparison: "DSS.CR_vs_DSS"
      case: "DSS.CR"
      control: "DSS"
    - id: "spleen_DSS_vs_CTL"
      tissue: "spleen"
      comparison: "DSS_vs_CTL"
      case: "DSS"
      control: "CTL"
    - id: "spleen_DSS.CR_vs_CTL"
      tissue: "spleen"
      comparison: "DSS.CR_vs_CTL"
      case: "DSS.CR"
      control: "CTL"
    - id: "spleen_DSS.CR_vs_DSS"
      tissue: "spleen"
      comparison: "DSS.CR_vs_DSS"
      case: "DSS.CR"
      control: "DSS"

# Pathway analysis
pathway:
  gsea:
    padj_threshold: 0.05
    organism: "mmu"  # Mouse KEGG organism code

# Microbiome analysis
microbiome:
  qiime2:
    prevalence_threshold: 0.03  # 3% of samples
  
  diversity:
    permutations: 999
  
  analysis:
    tree: null  # Optional Newick tree for phyloseq (set to null if unavailable)
  
  preprocessing:
    classifier: "silva-138-99-nb-classifier.qza"
    primers:
      front: "AGRGTTYGATYMTGGCTCAG"
      adapter: "RGYTACCTTGTTACGACTT"
    length:
      min: 1200
      max: 1800
    filter:
      min_feature_frequency: 2
      min_feature_samples: 1
      min_reads_per_sample: 2000
      contam_exclude: ["mitochondria", "chloroplast"]

# Human meta-analysis
